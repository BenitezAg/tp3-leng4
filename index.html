<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Práctico N°3 - Lenguaje IV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Primera tarjeta: Selección de imagen -->
        <div class="card">
            <p>Seleccionar Imagen:</p>
            <input type="file" id="fileInput" accept="image/*">
            <label for="fileInput" class="btn-subir">Subir Archivo</label>
        </div>
        <div class="card" id="resultCard" style="display: none;">
            <p id="fileName">Nombre: </p>
    
            <p id="fileType">Tipo: </p> 
            <p id="fileSize">Tamaño: </p>
            <img id="imagePreview" src="" alt="Vista previa de la imagen seleccionada">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
